name: Update BUILD quick start

on:
  push:
    branches:
      - docs/centralize-quick-start

permissions:
  contents: write

jobs:
  update-build-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/centralize-quick-start
      - name: Add explicit quick start to BUILD.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('BUILD.md')
          text = path.read_text(encoding='utf-8')
          if '## Quick start\n' not in text:
              intro = (
                  'This document is the source of truth for rebuilding the Windows helper files that are intentionally excluded from git. '
                  'The release/test ZIP may contain these BAT files for convenience, but the repository keeps `*.bat`, `*.cmd`, and `*.lnk` ignored.\n\n'
              )
              quick = (
                  '## Quick start\n\n'
                  'The GitHub repository intentionally does not include executable Windows launcher files. Use the downloadable release package, '
                  'or recreate the required launchers from the exact code blocks in this document.\n\n'
                  '1. Place the complete SeeStory project in a normal writable folder.\n'
                  '2. Run **`install_all.bat`**. This is the supported first-time setup entry point. It creates the Python environment, installs and verifies CUDA, checks ffmpeg, downloads and GPU-tests the required local model, optionally installs the Photorealistic model, and creates the desktop shortcut.\n'
                  '3. After setup completes, start SeeStory from the desktop shortcut or with **`run.bat`**.\n'
                  '4. Close the dedicated SeeStory window to stop the background service. Use **`stop.bat`** only when an explicit manual stop is needed.\n\n'
                  'For non-interactive setup, `install_all.bat default` installs only the required illustration model, while `install_all.bat all` installs both the illustration and Photorealistic models.\n\n'
              )
              if intro not in text:
                  raise SystemExit('BUILD.md introduction changed; refusing an unsafe insertion')
              text = text.replace(intro, intro + quick, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Commit BUILD.md update
        shell: bash
        run: |
          if git diff --quiet -- BUILD.md; then
            echo "BUILD.md already contains the quick start section."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD.md
          git commit -m "Add explicit BUILD quick start"
          git push origin HEAD:docs/centralize-quick-start
